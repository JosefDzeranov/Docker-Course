services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reviews
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # Проверяем, что база готова принимать подключения
      test: ["CMD-SHELL", "pg_isready -U postgres -d reviews"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/josefdzeranov/reviews-service:latest
    environment:
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
    depends_on:
      db:
        # Ждем не просто старта контейнера, а готовности базы (healthcheck прошел)
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  pg-data:
