services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: reviews
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      # Проверяем, что база готова принимать подключения
      test: ["CMD-SHELL", "pg_isready -U postgres -d reviews"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        # Ждем не просто старта контейнера, а готовности базы (healthcheck прошел)
        condition: service_healthy

volumes:
  pg-data:
