name: build-and-deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Код сервиса лежит в подпапке reviews-service, отсюда контекст сборки ./reviews-service
      - run: docker build -t ghcr.io/josefdzeranov/reviews-service:latest ./reviews-service
      - run: docker push ghcr.io/josefdzeranov/reviews-service:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Обновляем ТОЛЬКО свой контейнер. --no-deps не трогает db и redis, up -d пересоздает
      # лишь reviews-service. products-service продолжает работать нетронутым. Это независимая
      # выкатка. Системный docker-compose.yml лежит на сервере, его кладет туда инфра-репозиторий
      # dockercourse-deploy.
      - name: Deploy reviews-service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root
            docker compose pull reviews-service
            docker compose up -d --no-deps reviews-service
            docker image prune -f
