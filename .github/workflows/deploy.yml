on: push

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: docker login -u ironprogrammer -p ${{secrets.DOCKERHUB_TOKEN}}
            - run: docker build -t ironprogrammer/reviews-service:latest ./reviews-service
            - run: docker push ironprogrammer/reviews-service:latest
    
    deploy:
      needs: build
      runs-on: ubuntu-latest
      steps:
         - name: Deploy
           uses: appleboy/ssh-action@v1
           with:
             host: ${{ secrets.SERVER_HOST }}
             username: ${{ secrets.SERVER_USER }}
             key: ${{ secrets.SSH_PRIVATE_KEY }}
             script: docker compose pull && docker compose up -d
            
